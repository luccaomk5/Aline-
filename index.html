<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title> Nossa História - Aline & Lucas ❤️</title>
    <style>
        /* Animações e Efeitos */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes zoomHero {
            from { transform: scale(1.08); }
            to { transform: scale(1); }
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
            color: #4a4a4a;
            text-align: center;
            overflow-x: hidden;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        header.hero {
            padding: 80px 20px;
            animation: zoomHero 2s ease-out forwards;
        }

        h1 {
            font-size: 3.5rem;
            color: #b03060;
            margin: 0;
            font-family: 'Georgia', serif;
        }

        .subtitle {
            font-size: 1.3rem;
            color: #8b4444;
            margin-top: 10px;
            font-weight: 300;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 30px;
            margin: 30px 0;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            animation: fadeIn 1.2s ease both;
            line-height: 1.8;
            font-size: 1.1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin: 40px 0;
        }

        .photo-item {
            background: #fff;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            transition: all 0.4s ease;
            animation: fadeIn 1s ease both;
        }

        .photo-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(176, 48, 96, 0.2);
        }

        .photo-item img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 12px;
        }

        .caption {
            margin-top: 15px;
            font-style: italic;
            color: #b03060;
            font-weight: 500;
        }

        .btn-love {
            border: none;
            padding: 20px 45px;
            border-radius: 100px;
            font-size: 1.2rem;
            background: #b03060;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(176, 48, 96, 0.3);
            transition: 0.3s;
            margin: 40px 0;
            animation: float 3s ease-in-out infinite;
        }

        .btn-love:hover {
            background: #d81b60;
            transform: scale(1.05);
        }

        #final-surprise {
            display: none;
            margin-top: 30px;
        }

        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.5;
        }

        footer {
