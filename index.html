<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aline - Projeto Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">Aline</div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">Sobre</a></li>
                <li><a href="#contact">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home" class="hero">
            <h1>Bem-vindo ao Aline</h1>
            <p>Um projeto web incrível</p>
            <button class="btn">Começar Agora</button>
        </section>

        <section id="about" class="about">
            <h2>Sobre o Projeto</h2>
            <p>Este é um projeto web moderno desenvolvido com HTML, CSS e JavaScript.</p>
        </section>

        <section id="contact" class="contact">
            <h2>Entre em Contato</h2>
            <form>
                <input type="text" placeholder="Seu nome" required>
                <input type="email" placeholder="Seu email" required>
                <textarea placeholder="Sua mensagem" rows="5" required></textarea>
                <button type="submit" class="btn">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Aline. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
